name: modelarkapi

services:
  server:
    image: ranktotop/modelarkapi:backend-${IMG_VERSION:-latest}
    restart: unless-stopped
    environment:
      ARK_API_KEY: ${ARK_API_KEY}
      BYTEPLUS_ACCESS_KEY_ID: ${BYTEPLUS_ACCESS_KEY_ID}
      BYTEPLUS_SECRET_ACCESS_KEY: ${BYTEPLUS_SECRET_ACCESS_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      BYTEPLUS_ASSET_GROUP_ID: ${BYTEPLUS_ASSET_GROUP_ID}
      PROXY_API_KEY: ${PROXY_API_KEY}
      ASSET_JOB_DB: /app/state/proxy-jobs.db
      REQUIRE_PROXY_API_KEY: "true"
    ports:
      - "5192:8080"
    volumes:
      - reference_media:/app/data/references
      - server_state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        aliases:
          - modelarkapi_server

  ui:
    image: ranktotop/modelarkapi:frontend-${IMG_VERSION:-latest}
    restart: unless-stopped
    environment:
      MODELARK_PROXY_URL: http://modelarkapi_server:8080/v1
      MODELARK_PROXY_API_KEY: ${PROXY_API_KEY}
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD}
      UI_AUTH_DISABLED: ${UI_AUTH_DISABLED:-false}
      UI_SESSION_SECRET: ${UI_SESSION_SECRET}
      UI_COOKIE_SECURE: ${UI_COOKIE_SECURE:-true}
      UI_LOGIN_MAX_ATTEMPTS: ${UI_LOGIN_MAX_ATTEMPTS:-5}
      UI_LOGIN_WINDOW_SECONDS: ${UI_LOGIN_WINDOW_SECONDS:-900}
      UI_JOB_TTL_SECONDS: ${UI_JOB_TTL_SECONDS:-86400}
      UI_CLEANUP_INTERVAL_SECONDS: ${UI_CLEANUP_INTERVAL_SECONDS:-900}
      UI_POLL_INTERVAL_SECONDS: ${UI_POLL_INTERVAL_SECONDS:-10}
      UI_POLL_CONCURRENCY: ${UI_POLL_CONCURRENCY:-20}
      UI_MAX_PROXY_CONNECTIONS: ${UI_MAX_PROXY_CONNECTIONS:-100}
      UI_SESSION_TTL_SECONDS: ${UI_SESSION_TTL_SECONDS:-43200}
      UI_DB_PATH: /app/data/ui.db
    ports:
      - "5191:3000"
    volumes:
      - ui_state:/app/data
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        aliases:
          - modelarkapi_ui

volumes:
  reference_media:
  server_state:
  ui_state:

networks:
  default:
    driver: bridge
